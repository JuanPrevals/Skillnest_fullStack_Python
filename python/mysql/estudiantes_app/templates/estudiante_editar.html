<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar estudiante {{ estudiante.id_estudiante }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<main>
    <h1>Editar estudiante {{ estudiante.id_estudiante }}</h1>
    {% if errores %}<ul class="error" role="alert">{% for error in errores %}<li>{{ error }}</li>{% endfor %}</ul>{% endif %}
    <form class="form-editar" action="{{ url_for('actualizar_estudiante') }}" method="post">
        <input type="hidden" name="id_estudiante" value="{{ estudiante.id_estudiante }}">

        <label for="nombre">Nombre:</label>
        <input id="nombre" name="nombre" value="{{ datos.get('nombre', '') }}" maxlength="100" autocomplete="name" required>

        <label for="email">E-mail:</label>
        <input id="email" name="email" type="email" value="{{ datos.get('email', '') }}" maxlength="100" autocomplete="email" required>

        <div class="acciones">
            <button type="submit">Actualizar</button>
            <a href="{{ url_for('ver_estudiante', id_estudiante=estudiante.id_estudiante) }}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
