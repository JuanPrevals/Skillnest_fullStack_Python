<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mascotas</title>
</head>
<body>
    <h1>Listado de Mascotas</h1>
    {% if mascotas %}
    <ul>
        {% for mascota in mascotas %}
        <li><strong>{{ mascota.nombre }}</strong> - {{ mascota.tipo }} - {{ mascota.color }}</li>
        {% endfor %}
    </ul>
    {% else %}
    <p>No existen mascotas registradas.</p>
    {% endif %}
    <hr>
    <h2>Agregar una mascota</h2>
    <form action="/crear_mascota" method="POST">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre"><br>
        <label for="tipo">Tipo:</label>
        <input type="text" id="tipo" name="tipo"><br>
        <label for="color">Color:</label>
        <input type="text" id="color" name="color"><br>
        <input type="submit" value="Agregar Mascota">
    </form>
</body>
</html>
