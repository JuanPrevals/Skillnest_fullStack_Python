{% extends "base.html" %}

{% block title %}Editar taco {{ taco.id }} | Tacos MVC{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        <header class="text-center mb-4">
            <p class="text-uppercase text-secondary fw-semibold mb-2">Actualización del CRUD</p>
            <h1>Editar taco {{ taco.id }}</h1>
        </header>

        <form action="{{ url_for('actualizar', taco_id=taco.id) }}" method="post" class="bg-white border rounded p-4">
            <div class="mb-3">
                <label for="tortilla" class="form-label">Tortilla</label>
                <input type="text" name="tortilla" id="tortilla" class="form-control" maxlength="45" value="{{ taco.tortilla }}" required autofocus>
            </div>
            <div class="mb-3">
                <label for="guiso" class="form-label">Guiso</label>
                <input type="text" name="guiso" id="guiso" class="form-control" maxlength="45" value="{{ taco.guiso }}" required>
            </div>
            <div class="mb-4">
                <label for="salsa" class="form-label">Salsa</label>
                <input type="text" name="salsa" id="salsa" class="form-control" maxlength="45" value="{{ taco.salsa }}" required>
            </div>
            <div class="d-flex flex-wrap gap-2">
                <button type="submit" class="btn btn-primary">Actualizar taco</button>
                <a href="{{ url_for('detalle', taco_id=taco.id) }}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
