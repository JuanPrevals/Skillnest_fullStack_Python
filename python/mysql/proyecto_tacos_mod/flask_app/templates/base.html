<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Aplicación CRUD de tacos con Flask, MySQL y MVC">
    <title>{% block title %}Tacos MVC{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-sm bg-dark" data-bs-theme="dark" aria-label="Navegación principal">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">Tacos MVC</a>
            <div class="navbar-nav flex-row gap-3">
                <a class="nav-link" href="{{ url_for('index') }}">Crear taco</a>
                <a class="nav-link" href="{{ url_for('tacos') }}">Ver tacos</a>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        {% with mensajes = get_flashed_messages(with_categories=true) %}
            {% for categoria, mensaje in mensajes %}
                <div class="alert alert-{{ categoria }} alert-dismissible fade show" role="alert">
                    {{ mensaje }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
                </div>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
