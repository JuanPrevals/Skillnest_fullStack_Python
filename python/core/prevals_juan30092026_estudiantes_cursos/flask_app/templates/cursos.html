{% extends "base.html" %}

{% block title %}Cursos{% endblock %}

{% block contenido %}
<div class="columnas">
    <section>
        <h1>Nuevo Curso</h1>
        <form action="{{ url_for('crear_curso') }}" method="post">
            <div class="campo">
                <label for="nombre">Nombre</label>
                <input id="nombre" name="nombre" maxlength="45" required>
            </div>
            <button type="submit">Crear curso</button>
        </form>
    </section>

    <section>
        <h2>Todos los Cursos</h2>
        <ul class="lista-cursos">
            {% for curso in cursos %}
                <li><a href="{{ url_for('mostrar_curso', curso_id=curso.id) }}">{{ curso.nombre }}</a></li>
            {% else %}
                <li>No hay cursos registrados.</li>
            {% endfor %}
        </ul>
        <a class="enlace-accion" href="{{ url_for('nuevo_estudiante') }}">Agregar Estudiante</a>
    </section>
</div>
{% endblock %}
