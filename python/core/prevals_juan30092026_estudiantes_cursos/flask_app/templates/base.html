<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Estudiantes y Cursos{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="barra">
        <a href="{{ url_for('cursos') }}">Estudiantes y Cursos</a>
    </header>
    <main>
        {% with mensajes = get_flashed_messages(with_categories=true) %}
            {% if mensajes %}
                {% for categoria, mensaje in mensajes %}
                    <p class="mensaje {{ categoria }}" role="status">{{ mensaje }}</p>
                {% endfor %}
            {% endif %}
        {% endwith %}
        {% block contenido %}{% endblock %}
    </main>
</body>
</html>
