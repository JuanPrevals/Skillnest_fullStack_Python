<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoluntaMe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-light bg-light border-bottom border-dark border-2 mb-4 p-3 shadow-sm">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1 fw-bold fs-3">{% block titulo_nav %}VoluntaMe{% endblock %}</span>
            
            {% if 'usuario_id' in session %}
            <div>
                <a href="/dashboard" class="btn btn-custom me-2">Inicio</a>
                <a href="/logout" class="btn btn-custom">Cerrar Sesión</a>
            </div>
            {% endif %}
        </div>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
